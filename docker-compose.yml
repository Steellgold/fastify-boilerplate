version: "3.9"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate
      POSTGRES_DB: boilerplate
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://boilerplate:boilerplate@postgres:5432/boilerplate"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET:-change-me-in-production-at-least-32-chars}"
      BETTER_AUTH_URL: "http://localhost:3000"
      CORS_ORIGIN: "http://localhost:5173"
      HOST: "0.0.0.0"
      NODE_ENV: "production"
      LOG_LEVEL: "info"

volumes:
  pgdata: